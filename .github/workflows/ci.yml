# CI for the two JS frontends (openspec next-test-harness § CI job).
# Neither job needs a WordPress instance: nuxt-js generates against its nitro
# mock, next-js builds and tests against test/mock/server.mjs — both backed by
# the theme's committed contract fixtures.
#
# The theme's PHPUnit/vitest job is added by nuxt4-static-platform task 7.3.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nuxt-js:
    name: nuxt-js (lint, typecheck, test, generate:mock)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: nuxt-js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuxt-js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate:mock
      - run: npm run verify:output

  next-js:
    name: next-js (lint, typecheck, unit, build + budget, e2e, a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: next-js }
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      # Build once with the same env Playwright uses, then reuse it for both
      # Playwright projects (PW_SKIP_BUILD) so e2e and a11y test one artifact.
      - name: Build (mock API env)
        run: npm run build
        env:
          MOCK_API: "1"
          WP_API_BASE: http://127.0.0.1:8787/wp-json/progressnow/v1
          NEXT_PUBLIC_SITE_ORIGIN: http://127.0.0.1:3100
          CHAPTER_REBUILD_SECRET: playwright-test-secret
      - run: npm run budget
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional e2e (production build + mock API)
        run: npm run test:e2e
        env: { PW_SKIP_BUILD: "1" }
      - name: Accessibility gate (axe-core against the build)
        run: npm run test:a11y
        env: { PW_SKIP_BUILD: "1" }
      - name: Upload axe-core reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-js-axe-and-screenshots
          path: |
            next-js/test-results/axe/**
            next-js/test-results/styleguide/**
            next-js/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
