# CI for the theme and the two JS frontends (openspec next-test-harness § CI job).
# No job needs a WordPress instance: the theme runs PHPUnit on WorDBless,
# nuxt-js generates against its nitro mock, next-js builds and tests against
# test/mock/server.mjs — all backed by the theme's committed contract fixtures.
name: CI

on:
  push:
    branches: [main, 'cg/**', 'feat/**', 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: wp-content/themes/progressnow

jobs:
  js:
    name: Lint / typecheck / vitest / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wp-content/themes/progressnow/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node bin/twig-audit.mjs # autoescape on, every |raw marked, inline JSON via the encoder
      - run: npm test
      - run: npm run build # includes vue-tsc typecheck

  php:
    name: PHPUnit (WorDBless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: wp-content/themes/progressnow
      - run: composer test

  nuxt-js:
    name: nuxt-js (lint, typecheck, test, generate:mock)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: nuxt-js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuxt-js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate:mock
      - run: npm run verify:output
      - uses: actions/upload-artifact@v4
        with:
          name: nuxt-js-mock-output
          path: nuxt-js/.output/public
          retention-days: 3

  next-js:
    name: next-js (lint, typecheck, unit, build, e2e + budget, a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: next-js }
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      # Build once with the same env Playwright uses, then reuse it for both
      # Playwright projects (PW_SKIP_BUILD) so e2e and a11y test one artifact.
      # The build itself needs no API (routes render per request); the fixture
      # mock is started and stopped by the script for the standalone smoke.
      - name: Build (mock API)
        run: npm run build:mock
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional e2e (production build + mock API)
        run: npm run test:e2e
        env: { PW_SKIP_BUILD: "1" }
      - name: Accessibility gate (axe-core against the build)
        run: npm run test:a11y
        env: { PW_SKIP_BUILD: "1" }
      - name: Upstream-failure e2e (serial, flips the mock)
        run: npm run test:failure
        env: { PW_SKIP_BUILD: "1" }
      # Container smoke (openspec next-deployment § Container smoke): build the
      # standalone image, run it on the host network next to the mock, and hit
      # /api/health + / + /es/. Nothing is pushed.
      - name: Container image + smoke against the mock
        env:
          WP_API_BASE: http://127.0.0.1:8787/wp-json/progressnow/v1
          NEXT_PUBLIC_SITE_ORIGIN: http://127.0.0.1:3000
        run: |
          docker build -t progressnow-next:ci \
            --build-arg WP_API_BASE="$WP_API_BASE" \
            --build-arg NEXT_PUBLIC_SITE_ORIGIN="$NEXT_PUBLIC_SITE_ORIGIN" \
            --build-arg NEXT_PUBLIC_BUILD_ID="${GITHUB_SHA::7}" .
          node test/mock/server.mjs & echo $! > mock.pid
          docker run -d --name next --network host \
            -e MOCK_API=1 -e WP_API_BASE="$WP_API_BASE" \
            -e NEXT_PUBLIC_SITE_ORIGIN="$NEXT_PUBLIC_SITE_ORIGIN" \
            -e CHAPTER_REBUILD_SECRET=playwright-test-secret \
            progressnow-next:ci
          status=0
          node scripts/smoke.mjs http://127.0.0.1:3000 --timeout 60 || status=$?
          docker logs next
          docker rm -f next >/dev/null
          kill "$(cat mock.pid)" || true
          exit $status
      - name: Upload axe-core reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-js-axe-and-screenshots
          path: |
            next-js/test-results/axe/**
            next-js/test-results/styleguide/**
            next-js/playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
